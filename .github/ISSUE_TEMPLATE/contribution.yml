name: Contribution idea
description: Optional issue for proposing an ASCII-art contribution.
title: "ASCII contribution: "
body:
  - type: input
    id: github_user
    attributes:
      label: GitHub username
      placeholder: octocat
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add?
      description: A short description is enough; do not paste the full artwork here.
    validations:
      required: true
